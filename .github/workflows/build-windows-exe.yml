name: Build Windows Executable

on:
  push:
    branches: [ "main" ] # Triggers the build whenever you push to the main branch
  workflow_dispatch:      # Allows you to trigger the build manually from the browser

jobs:
  build:
    runs-on: windows-latest # Tells GitHub to use a real Windows virtual machine

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your preferred Python version if needed

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your project has a requirements.txt file, uncomment the line below:
        # pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        # Replace 'main.py' with the actual filename of your entry script
        pyinstaller --onefile --windowed main.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/*.exe
